server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

# Keep the standard Hibernate naming strategies so entity/field names map to the
# physical table and column names declared by the JPA mappings verbatim.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

jwt.issuer=users-service
jwt.secret=secret123
jwt.expiration.time.minutes=10
